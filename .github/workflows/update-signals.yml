name: Update live signals

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      run_manual_scan:
        description: "Run the Bybit + OKX scanner now"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: update-live-signals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Scan Bybit futures and validate with OKX
        env:
          SCAN_TOP: "20"
          SCAN_WORKERS: "3"
          OI_PERCENTILE: "99"
          OI_CHANGE_MIN_PCT: "3"
          OI_CHANGE_STRONG_PCT: "5"
          REQUIRE_5M_OI_CONFLUENCE: "true"
          MAX_SCAN_ERRORS: "5"
          STATE_REPLAY_WORKERS: "3"
          DIVERGENCE_CVD_PERCENTILE: "95"
          MAX_SEED_ROWS: "0"
          MAX_ACTIVE_PER_SYMBOL_SIDE: "2"
          SCAN_FALLBACK_LIMIT: "20"
          MIN_QUOTE_VOLUME_USDT: "5000000"
          MARKET_DATA_PROVIDER: "bybit+okx"
          CONTRACT_KLINE_CANDIDATES: "20"
          CONTRACT_DETAIL_CANDIDATES: "12"
        run: python scripts/update_seed_signals.py
      - name: Export website data
        run: python scripts/export_github_pages.py
      - name: Commit updated website data
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf data
          cp -r site/data ./data
          git add data sentiment_scanner/seed_signals.json sentiment_scanner/contract_anomalies.json sentiment_scanner/scanner_status.json
          if git diff --cached --quiet; then
            echo "No signal updates"
          else
            git commit -m "Update live Bybit and OKX signals"
            git pull --rebase origin main
            git push
          fi
