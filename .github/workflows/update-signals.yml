name: Update live signals

on:
  # Zeabur is the primary 24/7 scheduler. Keep this workflow as manual backup only.
  workflow_dispatch:
    inputs:
      run_backup_scan:
        description: "Run the manual backup scanner"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-live-signals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip
      - name: Scan Binance futures
        env:
          SCAN_TOP: "0"
          SCAN_WORKERS: "3"
          OI_PERCENTILE: "99"
          OI_CHANGE_MIN_PCT: "3"
          OI_CHANGE_STRONG_PCT: "5"
          REQUIRE_5M_OI_CONFLUENCE: "true"
          MAX_SCAN_ERRORS: "12"
          STATE_REPLAY_WORKERS: "3"
          DIVERGENCE_CVD_PERCENTILE: "95"
          MAX_SEED_ROWS: "0"
          MAX_ACTIVE_PER_SYMBOL_SIDE: "2"
          SCAN_FALLBACK_LIMIT: "120"
          MIN_QUOTE_VOLUME_USDT: "5000000"
          MARKET_DATA_PROVIDER: "mixed"
          CONTRACT_KLINE_CANDIDATES: "120"
          CONTRACT_DETAIL_CANDIDATES: "20"
          COINGLASS_REQUEST_BUDGET: "27"
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
          BINANCE_PROXY_URL: "https://wei-signal-trigger.qop880421.workers.dev"
          BINANCE_PROXY_TOKEN: ${{ secrets.BINANCE_PROXY_TOKEN }}
        run: |
          for attempt in 1 2; do
            python scripts/update_seed_signals.py && exit 0
            echo "Scan attempt ${attempt} failed; retrying shortly"
            sleep 20
          done
          exit 1
      - name: Export GitHub Pages data
        run: python scripts/export_github_pages.py
      - name: Commit updated signals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf data index.html
          cp -r site/* .
          git add sentiment_scanner/seed_signals.json sentiment_scanner/contract_anomalies.json sentiment_scanner/scanner_status.json data index.html
          if git diff --cached --quiet; then
            echo "No signal updates"
          else
            git commit -m "Update live sentiment signals"
            for attempt in 1 2 3; do
              git pull --rebase -X theirs
              git push && exit 0
              echo "Push attempt ${attempt} failed; retrying after rebase"
              sleep 5
            done
            exit 1
          fi
